<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>OBS Donation Ticker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style id="base-styles">
    /* CSS Variables initialized with defaults */
    :root {
      --bg-page: #0f172a;
      --bg-ticker: rgba(17, 24, 39, 0.95);
      --text-main: #ffffff;
      --text-accent: #7c3aed;
      --font-family: Inter, system-ui, -apple-system, sans-serif;
      --font-size: 1.35rem;
    }

    body {
      margin: 0;
      background: var(--bg-page);
      color: var(--text-main);
      font-family: var(--font-family);
      overflow: hidden; 
    }

    /* Top Donation Badge */
    .top-badge {
      position: fixed;
      top: 10px;
      right: 10px;
      background: var(--text-accent);
      color: white;
      padding: 6px 12px;
      border-radius: 6px;
      font-weight: 700;
      font-size: calc(var(--font-size) * 0.7);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
      z-index: 70;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: opacity 0.5s, transform 0.5s;
    }
    .top-badge.hidden {
      opacity: 0;
      transform: translateY(-10px);
    }
    .top-label {
      font-size: 0.8em;
      text-transform: uppercase;
      opacity: 0.8;
      margin-right: 4px;
    }

    .ticker-fixed {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 60;
    }

    .ticker-wrap {
      overflow: hidden;
      width: 100%;
      background: var(--bg-ticker);
      backdrop-filter: blur(4px);
      padding: 12px 8px;
      box-sizing: border-box;
      border-top: 1px solid rgba(255,255,255,0.05);
      transition: background 0.5s ease;
    }

    .ticker-viewport {
      position: relative;
      height: 1.4em; /* Height relative to font size */
      display: block;
    }

    .ticker-strip {
      position: absolute;
      top: 50%;
      white-space: nowrap;
      transform: translate3d(0, -50%, 0);
      will-change: transform;
      font-size: var(--font-size);
    }

    .donor {
      display: inline-block;
      margin-right: 36px;
      font-weight: 700;
      color: var(--text-main);
    }

    .sep {
      color: var(--text-accent);
      margin: 0 10px;
      font-weight: 700;
    }

    #status {
      position: fixed; top: 0; left: 0; padding: 4px;
      font-size: 10px; opacity: 0.3; pointer-events: none;
    }
  </style>
  <style id="custom-css"></style>
</head>
<body class="p-0">

  <div id="status">Wait...</div>

  <!-- Top Donation Widget -->
  <div id="topDonationWidget" class="top-badge hidden">
    <span class="top-label">🏆 TOP</span>
    <span id="topDonorName">Name</span>
    <span>•</span>
    <span id="topDonorAmount">0</span>
  </div>

  <div class="ticker-fixed">
    <div class="ticker-wrap">
      <div class="ticker-viewport" id="viewport">
        <div class="ticker-strip" id="stripA"></div>
        <div class="ticker-strip" id="stripB"></div>
      </div>
    </div>
  </div>

<script>
/* --- CONSTANTS --- */
const POLL_INTERVAL_MS = 3000;     
const CONFIG_INTERVAL_MS = 5000;   
const MAX_ITEMS = 15; 
const IN_SPEED_MULTIPLIER = 1.25;
const PAUSE_AT_END_MS = 25;
const MIN_DURATION_MS = 300;
const MAX_DURATION_MS = 60000;
const EXTRA_GAP_PX = 24;

/* --- ELEMENTS --- */
const stripA = document.getElementById('stripA');
const stripB = document.getElementById('stripB');
const viewport = document.getElementById('viewport');
const statusEl = document.getElementById('status');
const topWidget = document.getElementById('topDonationWidget');
const topNameEl = document.getElementById('topDonorName');
const topAmtEl = document.getElementById('topDonorAmount');
const root = document.documentElement;
const customCssEl = document.getElementById('custom-css');

/* --- HELPERS --- */
function getApiBase() {
    if (window.location.protocol === 'blob:' || window.location.protocol === 'file:') {
      return 'http://localhost:8000';
    }
    return '';
}
const API_BASE = getApiBase();
const JSON_FILE_PATH = `${API_BASE}/donations.json`;
const CONFIG_FILE_PATH = `${API_BASE}/config`;

function hexToRgb(hex) {
  const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
  return result ? `${parseInt(result[1], 16)}, ${parseInt(result[2], 16)}, ${parseInt(result[3], 16)}` : '17, 24, 39';
}

function escapeHtml(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

/* --- STATE --- */
let currentItems = null;
let pendingItems = null;
let currentConfig = { currency: '₹', speed: 120 }; // Default speed
let lastFetchedText = '';
let lastConfigText = '';
let contentWidth = 0;
let containerWidth = 0;
let visibleStrip = 'A';
let running = false;
let resizeTimer = null;
let safetyTimer = null; // Watchdog

/* --- FILTER LOGIC --- */
function filterDonations(donations, config) {
  if (!Array.isArray(donations)) return [];
  if (!config.filterType || config.filterType === 'lifetime') return donations;

  const now = new Date();
  const todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate()); 
  
  let startDate = null;
  let endDate = null;

  if (config.filterType === 'today') {
    startDate = todayStart;
  } else if (config.filterType === 'week') {
    startDate = new Date(now.getTime() - 7 * 24 * 60 * 60 * 1000);
  } else if (config.filterType === 'month') {
    startDate = new Date(now.getTime() - 30 * 24 * 60 * 60 * 1000);
  } else if (config.filterType === 'custom') {
    if (config.customStart) startDate = new Date(config.customStart);
    if (config.customEnd) {
      endDate = new Date(config.customEnd);
      endDate.setHours(23, 59, 59, 999); 
    }
  }

  return donations.filter(d => {
    const dDate = new Date(d.date);
    if (startDate && dDate < startDate) return false;
    if (endDate && dDate > endDate) return false;
    return true;
  });
}

/* --- CONFIG SYNC --- */
async function fetchConfig() {
  try {
    const res = await fetch(CONFIG_FILE_PATH);
    if(res.ok) {
      const txt = await res.text();
      if(txt !== lastConfigText) {
        lastConfigText = txt;
        const s = JSON.parse(txt);
        currentConfig = s;
        
        // Colors
        if(s.page) root.style.setProperty('--bg-page', s.page);
        if(s.text) root.style.setProperty('--text-main', s.text);
        if(s.accent) {
          root.style.setProperty('--text-accent', s.accent);
          topWidget.style.backgroundColor = s.accent;
        }
        if(s.ticker && s.opacity) {
          const rgb = hexToRgb(s.ticker);
          const alpha = parseInt(s.opacity) / 100;
          root.style.setProperty('--bg-ticker', `rgba(${rgb}, ${alpha})`);
        }

        // Typography
        if(s.font) root.style.setProperty('--font-family', s.font);
        if(s.fontSize) root.style.setProperty('--font-size', s.fontSize + "rem");

        // Custom CSS
        if(s.customCSS !== undefined) customCssEl.textContent = s.customCSS;
        
        // Re-process data to update currency symbol or filter changes
        if(lastFetchedText) {
           const parsed = JSON.parse(lastFetchedText);
           queueUpdateFromServer(parsed);
        }
      }
    }
  } catch(e) { console.log("Config fetch error", e); }
}

/* --- DATA PROCESSING --- */
function updateTopDonation(items) {
  if (!items || items.length === 0) {
    topWidget.classList.add('hidden');
    return;
  }
  // Find max tip
  const top = items.reduce((prev, current) => (parseFloat(current.tip) > parseFloat(prev.tip)) ? current : prev);
  if (top) {
    const cur = currentConfig.currency || '';
    topNameEl.textContent = escapeHtml(top.name);
    topAmtEl.textContent = `${cur}${parseFloat(top.tip).toLocaleString('en-IN')}`;
    topWidget.classList.remove('hidden');
  } else {
    topWidget.classList.add('hidden');
  }
}

function queueUpdateFromServer(rawArr){
  // 1. FILTER
  const filtered = filterDonations(rawArr, currentConfig);
  
  // 2. UPDATE TOP WIDGET
  updateTopDonation(filtered);

  // 3. SORT & SLICE for Ticker
  const sorted = filtered
    .sort((a,b)=>new Date(b.date)-new Date(a.date)) // Newest first
    .slice(0, MAX_ITEMS);
    
  // 4. QUEUE TICKER UPDATE
  if(Array.isArray(currentItems) && JSON.stringify(sorted) === JSON.stringify(currentItems)) {
     // Config might have changed (e.g. currency), so we force a layout update just in case,
     // but we don't restart the animation loop if it's already running nicely.
     layoutForItems(currentItems);
     return;
  }
  
  // New Data Detected!
  pendingItems = sorted;
  statusEl.textContent = `Queued ${sorted.length}`;
  
  // If the animation loop died or hasn't started, kick it.
  if (!running) {
    if(!Array.isArray(currentItems)) {
       currentItems = sorted;
       pendingItems = null;
    }
    layoutForItems(currentItems || []);
    setTimeout(() => moveOutThenIn(), 60);
  }
}

/* --- TICKER ANIMATION --- */
function formatDonor(d){ 
  const n = escapeHtml(d.name||'Anonymous'); 
  const t = Number(d.tip||0).toLocaleString('en-IN'); 
  const cur = currentConfig.currency || '';
  return `<span class="donor">${n} : ${cur}${t}</span>`; 
}

function buildSingleHTML(items){ 
  if(!Array.isArray(items)||items.length===0) return `<span class="donor">Waiting for donations...</span>`; 
  return items.slice(0,MAX_ITEMS).map(formatDonor).join(`<span class="sep">|</span>`); 
}

function measureHtmlWidth(html){
  const tmp = document.createElement('div');
  tmp.style.position='absolute'; tmp.style.visibility='hidden'; tmp.style.whiteSpace='nowrap';
  // Match styles exactly
  tmp.style.fontFamily = getComputedStyle(document.body).getPropertyValue('--font-family');
  tmp.style.fontWeight = '700';
  tmp.style.fontSize = getComputedStyle(document.body).getPropertyValue('--font-size');
  tmp.innerHTML = html;
  document.body.appendChild(tmp);
  const w = tmp.scrollWidth || 0;
  document.body.removeChild(tmp);
  return w;
}

function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }

function layoutForItems(items){
  const html = buildSingleHTML(items);
  // Only update innerHTML if it actually changed to prevent flashing
  if(stripA.innerHTML !== html) stripA.innerHTML = html;
  if(stripB.innerHTML !== html) stripB.innerHTML = html;

  containerWidth = viewport.clientWidth || window.innerWidth || 0;
  contentWidth = measureHtmlWidth(html);

  const minDistance = Math.max(contentWidth, containerWidth) + EXTRA_GAP_PX;
  contentWidth = Math.max(contentWidth, minDistance - EXTRA_GAP_PX);

  const offRight = containerWidth + EXTRA_GAP_PX;
  
  // If not running, reset positions
  if(!running) {
    stripA.style.transition='none';
    stripB.style.transition='none';
    if(visibleStrip === 'A'){
      stripA.style.transform = `translate3d(0px, -50%, 0)`;
      stripB.style.transform = `translate3d(${offRight}px, -50%, 0)`;
    } else {
      stripB.style.transform = `translate3d(0px, -50%, 0)`;
      stripA.style.transform = `translate3d(${offRight}px, -50%, 0)`;
    }
  }
}

function moveOutThenIn(){
  if(running) return;
  running = true;

  const outEl = (visibleStrip === 'A') ? stripA : stripB;
  const inEl  = (visibleStrip === 'A') ? stripB : stripA;

  // Apply Pending Data if available
  if(Array.isArray(pendingItems)){
    inEl.innerHTML = buildSingleHTML(pendingItems);
    const newMeasured = measureHtmlWidth(inEl.innerHTML);
    contentWidth = Math.max(contentWidth, newMeasured);
  }
  
  const offRight = containerWidth + EXTRA_GAP_PX;
  inEl.style.transition = 'none';
  inEl.style.transform = `translate3d(${offRight}px, -50%, 0)`;

  // Dynamic Speed
  const currentSpeed = parseInt(currentConfig.speed) || 120;

  const distanceOut = Math.max(contentWidth, containerWidth) + EXTRA_GAP_PX;
  const durationOutMs = clamp(Math.round((distanceOut / currentSpeed) * 1000), MIN_DURATION_MS, MAX_DURATION_MS);

  const distanceIn = containerWidth + EXTRA_GAP_PX;
  const durationInMs = clamp(Math.round((distanceIn / (currentSpeed * IN_SPEED_MULTIPLIER)) * 1000), MIN_DURATION_MS, MAX_DURATION_MS);

  // --- Animation Execution with Safety Net ---
  
  // 1. Start Out Animation
  requestAnimationFrame(() => {
    outEl.style.transition = `transform ${durationOutMs}ms linear`;
    outEl.style.transform = `translate3d(-${distanceOut}px, -50%, 0)`;
  });

  let finishedOut = false;
  const onOutEnd = () => {
    if(finishedOut) return;
    finishedOut = true;
    if(safetyTimer) clearTimeout(safetyTimer);
    
    // Pause briefly
    setTimeout(() => {
      // Reset Out Element
      outEl.style.transition = 'none';
      outEl.style.transform = `translate3d(${offRight}px, -50%, 0)`;

      // Swap Data
      if(Array.isArray(pendingItems)){
        currentItems = pendingItems;
        pendingItems = null;
        // Update the element that just left so it's ready for next time
        outEl.innerHTML = buildSingleHTML(currentItems);
      }

      // 2. Start In Animation
      inEl.style.transition = `transform ${durationInMs}ms cubic-bezier(0.22,0,0,1)`;
      inEl.style.transform = `translate3d(0px, -50%, 0)`;

      let finishedIn = false;
      const onInEnd = () => {
        if(finishedIn) return;
        finishedIn = true;
        
        visibleStrip = (visibleStrip === 'A') ? 'B' : 'A';
        setTimeout(() => {
          running = false;
          moveOutThenIn();
        }, PAUSE_AT_END_MS);
      };

      inEl.addEventListener('transitionend', onInEnd, {once:true});
      // Safety for IN animation
      setTimeout(onInEnd, durationInMs + 200);

    }, PAUSE_AT_END_MS);
  };

  outEl.addEventListener('transitionend', onOutEnd, {once:true});
  
  // Safety Watchdog: If transitionend misses (tab hidden), force next step
  safetyTimer = setTimeout(onOutEnd, durationOutMs + 500);

  statusEl.textContent = `Active | ${currentItems ? currentItems.length : 0}`;
}

async function fetchDonations(){
  try {
    const res = await fetch(JSON_FILE_PATH + '?_=' + Date.now(), { cache: 'no-store' });
    if(res.ok) {
      const txt = await res.text();
      if(txt !== lastFetchedText) {
        lastFetchedText = txt;
        let parsed = [];
        try { parsed = JSON.parse(txt); } catch(_) { parsed = []; }
        queueUpdateFromServer(parsed);
      }
    }
  } catch(err) {
    statusEl.textContent = 'Conn Error';
  }
}

function handleResizeEnd(){
  containerWidth = viewport.clientWidth || window.innerWidth || 0;
  // measure again
  const html = buildSingleHTML(currentItems || pendingItems || []);
  contentWidth = measureHtmlWidth(html);
  contentWidth = Math.max(contentWidth, containerWidth + 20);
  
  const offRight = containerWidth + EXTRA_GAP_PX;
  const visibleEl = (visibleStrip === 'A') ? stripA : stripB;
  const otherEl = (visibleStrip === 'A') ? stripB : stripA;
  
  // Reset without animation
  visibleEl.style.transition = 'none';
  otherEl.style.transition = 'none';
  visibleEl.style.transform = `translate3d(0px, -50%, 0)`;
  otherEl.style.transform = `translate3d(${offRight}px, -50%, 0)`;
}

window.addEventListener('resize', () => {
  if(resizeTimer) clearTimeout(resizeTimer);
  stripA.style.transition = 'none';
  stripB.style.transition = 'none';
  resizeTimer = setTimeout(() => { handleResizeEnd(); resizeTimer = null; }, 200);
});

// STARTUP
fetchConfig();
fetchDonations();
setInterval(fetchDonations, POLL_INTERVAL_MS);
setInterval(fetchConfig, CONFIG_INTERVAL_MS); 

// Heartbeat visual for debugging (bottom left hidden pixel)
const beat = document.createElement('div');
beat.style.cssText = 'position:fixed;bottom:0;left:0;width:2px;height:2px;background:lime;z-index:9999;opacity:0.2';
document.body.appendChild(beat);
setInterval(() => { beat.style.display = beat.style.display==='none'?'block':'none'; }, 1000);

</script>
</body>
</html>
